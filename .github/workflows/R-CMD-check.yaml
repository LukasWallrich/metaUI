name: R-CMD-check
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package and generate smoke fixture
        run: |
          R CMD INSTALL .
          Rscript --vanilla tools/browser-fixture.R "$RUNNER_TEMP/metaui-smoke"
          Rscript --vanilla tools/design-fixture.R "$RUNNER_TEMP/metaui-design"
      - name: Install browser in runner scratch directory
        run: |
          npm install --prefix "$RUNNER_TEMP/metaui-browser" --no-save playwright@1.63.0
          "$RUNNER_TEMP/metaui-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise generated standalone app in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/metaui-browser/node_modules
          METAUI_SMOKE_DIR: ${{ runner.temp }}/metaui-smoke
        run: node tools/browser-smoke.cjs
      - name: Exercise the author helper and light/dark generated apps
        env:
          NODE_PATH: ${{ runner.temp }}/metaui-browser/node_modules
          METAUI_DESIGN_ROOT: ${{ runner.temp }}/metaui-design
        run: node tools/design-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-app-browser-evidence
          path: |
            ${{ runner.temp }}/metaui-smoke/evidence
            ${{ runner.temp }}/metaui-design/evidence
